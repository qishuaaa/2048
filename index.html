<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>2048</h1>
    <div class="scores">
      <div class="score-box">
        <div class="label">分数</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="label">最高分</div>
        <div class="value" id="best">0</div>
      </div>
    </div>
  </header>

  <div class="hint">合并相同的数字,拼出 <strong>2048</strong>!</div>

  <div class="board" id="board"></div>

  <div class="controls">
    <button id="newGame">新游戏</button>
    <button id="customize" class="secondary">📷 自定义图片</button>
  </div>

  <div class="uploader hidden" id="uploader">
    <div class="uploader-box">
      <div class="uploader-title">上传自定义图片</div>
      <div class="uploader-text">按顺序上传 2 → 4 → 8 → 16 → 32 → 64 → 128 → 256 → 512 → 1024 → 2048 共 11 张图片</div>
      <div class="uploader-list" id="uploaderList"></div>
      <div class="uploader-actions">
        <button id="uploadBtn" class="secondary">选择图片</button>
        <button id="resetImg" class="secondary">恢复默认配色</button>
        <button id="closeUploader" class="secondary">完成</button>
      </div>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*" multiple hidden>

  <div class="overlay" id="overlay">
    <div class="overlay-box">
      <div class="overlay-title" id="overlayTitle"></div>
      <div class="overlay-text" id="overlayText"></div>
      <button id="overlayBtn">再来一局</button>
    </div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
